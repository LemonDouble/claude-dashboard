# pnpm 11 reads project settings here instead of package.json and .npmrc.
engineStrict: false

overrides:
  postcss: ^8.5.10
  sharp: ^0.35.0
  ip-address: ^10.1.1
  '@hono/node-server': ^2.0.5

allowBuilds:
  msw: true
  sharp: true
  unrs-resolver: true

# Exact exceptions for the freshly released September 2026 security patch.
# The one-day minimumReleaseAge default still applies to all other packages.
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - eslint-config-next@16.3.8
  - next@16.3.8
